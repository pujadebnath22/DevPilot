# Test profile for the full-context integration test (BackendApplicationTests).
# Requires the docker-compose PostgreSQL + pgvector database (or DB_URL pointing to one).
# All other values are dummies: no GitHub or Gemini calls are made while the context starts.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=test-dummy-key
spring.ai.google.genai.chat.model=gemini-test
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=test-dummy-key
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.security.oauth2.client.registration.github.client-id=test-client
spring.security.oauth2.client.registration.github.client-secret=test-secret
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

app.frontend-url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000
app.token-encryptor-password=test-password
app.token-encryptor-salt=deadbeefcafebabe
